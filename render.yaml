databases:
  - name: doctranslate-db
    plan: free
    databaseName: doctranslate
    user: doctranslate

services:
  - type: web
    name: doctranslate
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run client:build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: doctranslate-db
          property: connectionString
      - key: WXRKS_API_URL
        value: https://app.wxrks.com/api/v3
      - key: WXRKS_ACCESS_KEY
        sync: false
      - key: WXRKS_SECRET
        sync: false
      - key: WXRKS_PAID_ORG_UNIT_UUID
        sync: false
      - key: WXRKS_FREE_ORG_UNIT_UUID
        sync: false
      - key: APP_BASE_URL
        sync: false # set to the public Render URL after first deploy
      - key: COOKIE_SECRET
        generateValue: true
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FREE_TIER_MAX_WORDS
        value: "1000"
      - key: POLL_INTERVAL_MS
        value: "60000"
      - key: RETENTION_DAYS
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "25"
